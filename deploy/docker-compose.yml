# Production stack for the Ubuntu box. Everything the agent needs runs here — Postgres,
# Redis, the worker, the read API, and TLS termination. One `docker compose up -d` and
# the machine is the whole backend.
#
#   cd /opt/fishnu && docker compose -f deploy/docker-compose.yml up -d
#
# Postgres and Redis are NOT published to the host. They are reachable only on the
# compose network, by service name — a memecoin server with an open 5432 is found by
# scanners within hours.

name: fishnu

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fishnu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-fishnu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fishnu} -d ${POSTGRES_DB:-fishnu}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist the tick lock's neighbourhood; the lock itself is ephemeral by design.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    command: ["pnpm", "--filter", "@fishnu/db", "push", "--force"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fishnu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fishnu}
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "@fishnu/agent", "start"]
    # Exactly one. The Redis lock is the backstop, this is the intent: two agents means
    # two replies to the same mention.
    deploy:
      replicas: 1
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-fishnu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fishnu}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "@fishnu/api", "start"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      API_PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-fishnu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fishnu}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only ports open to the internet. Caddy gets a Let's Encrypt certificate on its
    # own; the Vercel frontend cannot open an EventSource to a plain-http origin, so TLS
    # here is a requirement, not a nicety.
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
